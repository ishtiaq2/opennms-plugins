#
# A second Karaf deploy folder, for plugin KARs you manage from the host.
#
# The container's entrypoint copies this file into $OPENNMS_HOME/etc/ at every start. Karaf reads
# every etc/org.apache.felix.fileinstall-<name>.cfg as one more Felix FileInstall watcher, next to
# the built-in one for $OPENNMS_HOME/deploy (etc/org.apache.felix.fileinstall-deploy.cfg).
# compose.yml bind-mounts the host folder ./deploy at the directory below, so:
#
#   copy a .kar into ./deploy   -> Karaf installs it (and its features, unless the KAR says not to)
#   replace it with a new build -> Karaf uninstalls the old one and installs the new one
#   delete it                   -> Karaf uninstalls it
#
# The values mirror Karaf's own deploy watcher; only dir, tmpdir and filter differ.
#
felix.fileinstall.dir           = /opt/opennms-lab-deploy
felix.fileinstall.tmpdir        = ${karaf.data}/generated-bundles-lab
# Only *.kar files. Temporary names (scripts/deploy-plugin.sh copies to .<name>.kar.part and then
# renames), README files and sub-folders are ignored. [.] is a literal dot without a backslash.
felix.fileinstall.filter        = .*[.]kar
felix.fileinstall.poll          = 1000
felix.fileinstall.start.level   = 80
felix.fileinstall.active.level  = 80
felix.fileinstall.log.level     = 3
