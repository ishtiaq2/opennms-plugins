<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="t d">
<title id="t">JARs, bundles, features, KARs: what a plugin is made of</title>
<desc id="d">The lab&#x27;s Node Inventory plugin, opened up. A KAR carries a features XML and the bundle; the bundle is a JAR with OSGi headers, a Blueprint file, its class and the UI module.</desc>
<defs></defs>
<rect x="0.5" y="0.5" width="1099" height="759" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
<text x="24" y="36" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="21" font-weight="bold" fill="#0f172a">JARs, bundles, features, KARs: what a plugin is made of</text>
<text x="24" y="59" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" fill="#475569">The lab&#x27;s Node Inventory plugin, opened up. A KAR carries a features XML and the bundle; the bundle is a JAR</text>
<text x="24" y="78" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" fill="#475569">with OSGi headers, a Blueprint file, its class and the UI module.</text>
<rect x="24" y="114" width="596" height="612" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="7 5"/>
<text x="38" y="136" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#1e3a8a"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13.0">opennms-lab-node-inventory-plugin.kar</tspan><tspan>: a ZIP</tspan></text>
<rect x="40" y="154" width="564" height="52" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<text x="52" y="176" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0f172a"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13.0">META-INF/MANIFEST.MF</tspan></text>
<text x="52" y="194.85" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12.1">Karaf-Feature-Start: false</tspan><tspan> would stop the automatic install</tspan></text>
<rect x="40" y="220" width="564" height="490" rx="12" fill="#fefce8" stroke="#ca8a04" stroke-width="1.8"/>
<text x="54" y="242" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#713f12"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13.0">repository/</tspan><tspan>: a small Maven repository</tspan></text>
<rect x="56" y="260" width="532" height="104" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<text x="68" y="282" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0f172a"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13.0">.../node-inventory-karaf-features-...-features.xml</tspan></text>
<text x="68" y="300.85" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">a features repository with one feature,</text>
<text x="68" y="318.79" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12.1">opennms-lab-node-inventory</tspan><tspan>: the features </tspan><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12.1">aries-blueprint</tspan></text>
<text x="68" y="336.73" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a"><tspan>and </tspan><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12.1">opennms-integration-api</tspan><tspan>, plus the bundle below</tspan></text>
<rect x="56" y="378" width="532" height="316" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/>
<text x="70" y="400" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#4c1d95"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13.0">.../node-inventory-plugin-1.0.0-SNAPSHOT.jar</tspan><tspan>: the bundle</tspan></text>
<rect x="72" y="416" width="500" height="70" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<text x="84" y="438" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0f172a"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13.0">META-INF/MANIFEST.MF</tspan></text>
<text x="84" y="456.85" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12.1">Bundle-SymbolicName</tspan><tspan>, </tspan><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12.1">Bundle-Version</tspan><tspan>, and </tspan><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12.1">Import-Package</tspan><tspan>:</tspan></text>
<text x="84" y="474.79" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12.1">org.opennms.integration.api.v1.ui</tspan><tspan>, ...</tspan></text>
<rect x="72" y="498" width="500" height="52" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<text x="84" y="520" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0f172a"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13.0">OSGI-INF/blueprint/blueprint.xml</tspan></text>
<text x="84" y="538.85" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a"><tspan>registers a </tspan><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12.1">UIExtension</tspan><tspan> service (Step 10)</tspan></text>
<rect x="72" y="562" width="500" height="52" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<text x="84" y="584" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0f172a"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13.0">org/example/.../NodeInventoryUIExtension.class</tspan></text>
<text x="84" y="602.85" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a"><tspan>implements the Integration API interface </tspan><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12.1">UIExtension</tspan></text>
<rect x="72" y="626" width="500" height="52" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
<text x="84" y="648" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#1e3a8a"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13.0">node-inventory/nodeInventory.es.js</tspan></text>
<text x="84" y="666.85" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#1e3a8a"><tspan>the UI module built by Vite (plus </tspan><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12.1">style.css</tspan><tspan>), served at Step 13</tspan></text>
<rect x="640" y="114" width="436" height="392" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
<text x="654" y="136" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0f172a">Five words</text>
<rect x="656" y="154" width="404" height="64" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="668" y="175.5" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="bold" text-anchor="start" fill="#334155">JAR</text>
<text x="668" y="193.625" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#334155">classes and files in a ZIP, plus a manifest;</text>
<text x="668" y="210.875" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#334155">a class loader reads classes from it</text>
<rect x="656" y="224" width="404" height="64" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="668" y="245.5" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="bold" text-anchor="start" fill="#334155">Bundle</text>
<text x="668" y="263.625" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#334155">a JAR whose manifest names it, versions it and lists</text>
<text x="668" y="280.875" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#334155">its imports and exports; Felix gives it a loader</text>
<rect x="656" y="294" width="404" height="64" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="668" y="315.5" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="bold" text-anchor="start" fill="#334155">Feature</text>
<text x="668" y="333.625" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#334155">a named set of bundles (and features, configuration)</text>
<text x="668" y="350.875" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#334155">in a features XML, installed as one unit</text>
<rect x="656" y="364" width="404" height="64" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="668" y="385.5" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="bold" text-anchor="start" fill="#334155">KAR</text>
<text x="668" y="403.625" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#334155">a ZIP with a features XML and the bundles it needs,</text>
<text x="668" y="420.875" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#334155">in Maven layout: installs offline</text>
<rect x="656" y="434" width="404" height="64" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="668" y="455.5" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="bold" text-anchor="start" fill="#334155">Plugin</text>
<text x="668" y="473.625" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#334155">for OpenNMS, usually a KAR whose bundle registers</text>
<text x="668" y="490.875" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#334155">Integration API services</text>
<rect x="640" y="522" width="436" height="204" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
<text x="654" y="544" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0f172a">Where each kind lives in the container</text>
<rect x="656" y="560" width="404" height="150" rx="9" fill="#fefce8" stroke="#ca8a04" stroke-width="1.6"/>
<text x="668" y="580.5" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#713f12"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.6">lib/*.jar</tspan><tspan>: plain JARs, the lib/ class loader</tspan></text>
<text x="668" y="597.75" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#713f12"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.6">jetty-webapps/opennms/WEB-INF/lib/</tspan><tspan>: web app JARs</tspan></text>
<text x="668" y="615.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#713f12"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.6">system/</tspan><tspan>: bundles and features XML (Maven layout)</tspan></text>
<text x="668" y="632.25" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#713f12"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.6">deploy/</tspan><tspan>, </tspan><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.6">/opt/opennms-lab-deploy/</tspan><tspan>: KARs to install</tspan></text>
<text x="668" y="649.5" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#713f12"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.6">data/kar/&lt;name&gt;/</tspan><tspan>: unpacked KARs</tspan></text>
<text x="668" y="666.75" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#713f12"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.6">data/cache/bundle&lt;id&gt;/</tspan><tspan>: installed bundles</tspan></text>
</svg>
