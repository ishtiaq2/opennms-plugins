<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="948" viewBox="0 0 1100 948" role="img" aria-labelledby="t d">
<title id="t">Jetty and Felix: how a request gets from the network into OSGi</title>
<desc id="d">The only way in is Jetty&#x27;s port. The ProxyFilter, last in the web app&#x27;s filter chain, sends paths that OSGi has claimed to the Felix HTTP bridge; the bridge opens no port of its own and runs on Jetty&#x27;s request thread.</desc>
<defs><marker id="aea580c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="a7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs>
<rect x="0.5" y="0.5" width="1099" height="947" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
<text x="24" y="36" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="21" font-weight="bold" fill="#0f172a">Jetty and Felix: how a request gets from the network into OSGi</text>
<text x="24" y="59" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" fill="#475569">The only way in is Jetty&#x27;s port. The ProxyFilter, last in the web app&#x27;s filter chain, sends paths that OSGi has claimed</text>
<text x="24" y="78" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" fill="#475569">to the Felix HTTP bridge; the bridge opens no port of its own and runs on Jetty&#x27;s request thread.</text>
