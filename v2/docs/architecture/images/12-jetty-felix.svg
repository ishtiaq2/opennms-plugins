<rect x="24" y="818" width="526" height="110" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="36" y="840" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#334155">How the web app finds Felix</text>
<text x="36" y="858.125" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#334155"><tspan>WebAppListener put the </tspan><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.6">BundleContext</tspan><tspan> into the servlet</tspan></text>
<text x="36" y="875.375" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#334155"><tspan>context (Step 6); </tspan><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.6">ServiceTracker</tspan><tspan>s follow the dispatcher,</tspan></text>
<text x="36" y="892.625" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#334155">servlets and resources; REST paths come from the</text>
<text x="36" y="909.875" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#334155"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.6">RestEndpointRegistry</tspan><tspan> service</tspan></text>
<rect x="566" y="818" width="510" height="110" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="578" y="840" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#334155">No second web server</text>
<text x="578" y="858.125" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#334155">OSGi servlets run on the Jetty thread, behind the same</text>
<text x="578" y="875.375" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#334155">filters and the same login. Other ports in this process</text>
<text x="578" y="892.625" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#334155"><tspan>are not HTTP: Karaf SSH </tspan><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.6">8101</tspan><tspan>, SNMP traps </tspan><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.6">1162/udp</tspan><tspan>.</tspan></text>
