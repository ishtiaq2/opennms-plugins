<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="790" viewBox="0 0 1100 790" role="img" aria-labelledby="t d">
<title id="t">Felix, the OSGi framework under Karaf</title>
<desc id="d">Felix implements the OSGi core: bundles with class loaders of their own, their life cycle, and a registry of services. Karaf is the distribution around it; several Felix sub-projects run inside it as ordinary bundles.</desc>
<defs><marker id="a7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs>
<rect x="0.5" y="0.5" width="1099" height="789" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
<text x="24" y="36" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="21" font-weight="bold" fill="#0f172a">Felix, the OSGi framework under Karaf</text>
<text x="24" y="59" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" fill="#475569">Felix implements the OSGi core: bundles with class loaders of their own, their life cycle, and a registry of services.</text>
<text x="24" y="78" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" fill="#475569">Karaf is the distribution around it; several Felix sub-projects run inside it as ordinary bundles.</text>
<rect x="24" y="114" width="516" height="472" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
<text x="38" y="136" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0f172a">The layers</text>
<rect x="40" y="154" width="484" height="70" rx="9" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
<text x="52" y="176" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#4c1d95">Karaf 4.3.10: the distribution</text>
<text x="52" y="194.85" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#4c1d95">features and KARs, deployers, SSH shell, JAAS login,</text>
<text x="52" y="212.79" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#4c1d95"><tspan>logging (Pax Logging), the files in </tspan><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12.1">etc/</tspan></text>
<rect x="40" y="238" width="484" height="282" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/>
<text x="54" y="260" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#4c1d95">Felix 6.0.5: the OSGi framework (core R7)</text>
<rect x="56" y="276" width="452" height="70" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<text x="68" y="298" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0f172a">Service layer</text>
<text x="68" y="316.85" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">a registry of objects by interface name and</text>
<text x="68" y="334.79" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">properties; LDAP-filter look-ups; change events</text>
<rect x="56" y="356" width="452" height="70" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<text x="68" y="378" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0f172a">Life-cycle layer</text>
<text x="68" y="396.85" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">install, resolve, start, stop, update,</text>
<text x="68" y="414.79" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">uninstall; start levels set the boot order</text>
<rect x="56" y="436" width="452" height="70" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<text x="68" y="458" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0f172a">Module layer</text>
<text x="68" y="476.85" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a"><tspan>one class loader per bundle; each </tspan><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12.1">Import-Package</tspan></text>
<text x="68" y="494.79" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a"><tspan>is wired to another bundle&#x27;s </tspan><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12.1">Export-Package</tspan></text>
<rect x="40" y="534" width="484" height="38" rx="9" fill="#ffffff" stroke="#0f172a" stroke-width="1.6"/>
<text x="282.0" y="555.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0f172a">the JVM: the one OpenNMS process (Step 2)</text>
