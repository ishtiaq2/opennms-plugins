<text x="40" y="738" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#4c1d95">Not Felix, used alongside: Aries Blueprint (XML wiring), Pax Logging, Pax URL (mvn: URLs), the JAX-RS connector.</text>
