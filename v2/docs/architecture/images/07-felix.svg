<text x="588" y="486.5" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#0f172a">the framework itself. It exports the JDK&#x27;s packages plus</text>
<text x="588" y="503.75" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#0f172a"><tspan>the 1,383 packages listed in </tspan><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.6">etc/custom.properties</tspan><tspan>,</tspan></text>
<text x="588" y="521.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#0f172a"><tspan>183 of them </tspan><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.6">org.opennms.*</tspan><tspan>: bundles use the same classes</tspan></text>
<text x="588" y="538.25" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#0f172a"><tspan>from </tspan><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.6">lib/</tspan><tspan> as the daemons do (Steps 9 and 11).</tspan></text>
