<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="750" viewBox="0 0 1100 750" role="img" aria-labelledby="t d">
<title id="t">Shared assets: one folder, served by Jetty, read by every plugin in the browser</title>
<desc id="d">No OSGi and no Java code of yours: the folder is a directory inside the /opennms web app, served like OpenNMS&#x27;s own JavaScript. Plugins find the files through a fixed URL and the index manifest.json.</desc>
<defs><marker id="adb2777" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker></defs>
<rect x="0.5" y="0.5" width="1099" height="749" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
<text x="24" y="36" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="21" font-weight="bold" fill="#0f172a">Shared assets: one folder, served by Jetty, read by every plugin in the browser</text>
<text x="24" y="59" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" fill="#475569">No OSGi and no Java code of yours: the folder is a directory inside the /opennms web app, served like OpenNMS&#x27;s</text>
<text x="24" y="78" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" fill="#475569">own JavaScript. Plugins find the files through a fixed URL and the index manifest.json.</text>
<rect x="24" y="114" width="292" height="330" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.8"/>
<text x="38" y="136" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111827">Your machine</text>
<rect x="40" y="154" width="260" height="180" rx="9" fill="#fce7f3" stroke="#db2777" stroke-width="1.6"/>
<text x="52" y="176" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#831843"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13.0">./shared-assets/</tspan></text>
<text x="52" y="194.125" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#831843"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.6">manifest.json</tspan><tspan>: the index,</tspan></text>
<text x="52" y="211.375" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#831843"><tspan>with </tspan><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.6">revision</tspan><tspan> and the rules</tspan></text>
<text x="52" y="228.625" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#831843"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.6">icons/router.svg</tspan><tspan>, </tspan><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.6">switch.svg</tspan><tspan>, ...</tspan></text>
<text x="52" y="245.875" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#831843"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.6">branding/lab-banner.png</tspan></text>
<text x="52" y="263.125" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#831843"></text>
<text x="52" y="280.375" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#831843"><tspan>edited with </tspan><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.6">scripts/assets.py</tspan></text>
<rect x="40" y="350" width="260" height="76" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="52" y="370.5" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#334155">new file: served at once</text>
<text x="52" y="387.75" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#334155"><tspan>changed file: bump </tspan><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.6">revision</tspan><tspan>,</tspan></text>
<text x="52" y="405.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#334155"><tspan>every </tspan><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.6">?rev=</tspan><tspan> changes</tspan></text>
<rect x="336" y="114" width="404" height="520" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.8" stroke-dasharray="7 5"/>
<text x="350" y="136" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0f172a">Container: the /opennms web app</text>
<rect x="352" y="154" width="372" height="70" rx="9" fill="#fce7f3" stroke="#db2777" stroke-width="1.6"/>
<text x="364" y="176" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#831843"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13.0">jetty-webapps/opennms/assets/shared/</tspan></text>
<text x="364" y="194.125" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#831843">the same folder, mounted read-only</text>
<rect x="352" y="246" width="372" height="88" rx="9" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/>
<text x="364" y="268" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#7c2d12">Jetty and the filters</text>
<text x="364" y="286.125" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#7c2d12"><tspan>no login needed for </tspan><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.6">/assets/**</tspan><tspan>,</tspan></text>
<text x="364" y="303.375" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#7c2d12"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.6">nosniff</tspan><tspan>, CSP of the UI&#x27;s own origin</tspan></text>
<rect x="352" y="356" width="372" height="106" rx="9" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/>
<text x="364" y="378" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#7c2d12">DefaultServlet</text>
<text x="364" y="396.125" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#7c2d12">reads the file from disk on each request</text>
<text x="364" y="413.375" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#7c2d12">(cached by modification time);</text>
<text x="364" y="430.625" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#7c2d12"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.6">Cache-Control: max-age=3600,public</tspan></text>
<rect x="352" y="484" width="372" height="130" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<text x="364" y="506" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0f172a">URL</text>
<text x="364" y="524.125" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#0f172a"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.6">/opennms/assets/shared/manifest.json</tspan></text>
<text x="364" y="541.375" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#0f172a"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.6">/opennms/assets/shared/icons/router.svg</tspan></text>
<text x="364" y="558.625" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#0f172a"></text>
<text x="364" y="575.875" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#0f172a">same origin as the UI, so the UI&#x27;s</text>
<text x="364" y="593.125" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#0f172a"><tspan>CSP (</tspan><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.6">img-src &#x27;self&#x27;</tspan><tspan>) allows it</tspan></text>
<path d="M300,244 L318,244 L318,189 L350,189" fill="none" stroke="#db2777" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#adb2777)" stroke-linejoin="round"/>
