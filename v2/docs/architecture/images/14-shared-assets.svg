<path d="M538,462 L538,482" fill="none" stroke="#db2777" stroke-width="1.8" marker-end="url(#adb2777)" stroke-linejoin="round"/>
<rect x="760" y="114" width="316" height="520" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
<text x="774" y="136" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0f172a">Who reads it (all in the browser)</text>
<rect x="776" y="154" width="284" height="120" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
<text x="788" y="176" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#1e3a8a">Plugin A&#x27;s JavaScript</text>
<text x="788" y="194.125" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1e3a8a"><tspan>the shared helper: </tspan><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.6">GET manifest.json</tspan></text>
<text x="788" y="211.375" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1e3a8a"><tspan>(</tspan><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.6">no-cache</tspan><tspan>: a 304 when unchanged),</tspan></text>
<text x="788" y="228.625" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1e3a8a"><tspan>then </tspan><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.6">&lt;img&gt;</tspan><tspan> URLs with </tspan><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.6">?rev=1</tspan></text>
<rect x="776" y="286" width="284" height="88" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
<text x="788" y="308" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#1e3a8a">Plugin B&#x27;s JavaScript</text>
<text x="788" y="326.125" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1e3a8a">the same helper, the same URLs:</text>
<text x="788" y="343.375" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1e3a8a">one browser cache for both</text>
<rect x="776" y="386" width="284" height="88" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<text x="788" y="408" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0f172a">Any page or tool</text>
<text x="788" y="426.125" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#0f172a"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.6">&lt;img src=&quot;/opennms/assets/...&quot;&gt;</tspan><tspan>,</tspan></text>
<text x="788" y="443.375" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#0f172a">the classic UI, curl</text>
<rect x="776" y="486" width="284" height="128" rx="9" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6"/>
<text x="788" y="508" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#334155">Not involved</text>
<text x="788" y="526.125" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#334155">Karaf, Felix, bundles and the</text>
<text x="788" y="543.375" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#334155">plugin JARs: no Java code</text>
<text x="788" y="560.625" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#334155">reads the folder, nothing is</text>
<text x="788" y="577.875" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#334155">deployed for a new image</text>
<path d="M724,549 L744,549 L744,214 L774,214" fill="none" stroke="#db2777" stroke-width="1.8" marker-end="url(#adb2777)" stroke-linejoin="round"/>
<path d="M744,330 L774,330" fill="none" stroke="#db2777" stroke-width="1.8" marker-end="url(#adb2777)" stroke-linejoin="round"/>
<path d="M744,430 L774,430" fill="none" stroke="#db2777" stroke-width="1.8" marker-end="url(#adb2777)" stroke-linejoin="round"/>
<rect x="24" y="466" width="292" height="168" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="36" y="488" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#334155">Why not inside a plugin JAR?</text>
<text x="36" y="506.125" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#334155">the module endpoint serves only</text>
<text x="36" y="523.375" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#334155">the module (as JavaScript) and</text>
<text x="36" y="540.625" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#334155"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.6">style.css</tspan><tspan>: images do not work</tspan></text>
<text x="36" y="557.875" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#334155">there, and every plugin would</text>
<text x="36" y="575.125" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#334155">carry its own copy (Part 1)</text>
<rect x="24" y="654" width="1052" height="76" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="36" y="676" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#334155">The contract every plugin relies on (Part 3)</text>
<text x="36" y="694.125" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#334155"><tspan>a fixed base URL, </tspan><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.6">/opennms/assets/shared/</tspan><tspan>, plus </tspan><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.6">manifest.json</tspan><tspan> as the index of files and node-icon rules; the helper package</tspan></text>
<text x="36" y="711.375" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#334155"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.6">@onms-lab/shared-assets</tspan><tspan> is compiled into each plugin&#x27;s JavaScript, so the plugins share files, not code at run time.</tspan></text>
</svg>
