<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800" role="img" aria-labelledby="t d">
<title id="t">Plugin A and plugin B: many UIs from one server</title>
<desc id="d">Both plugins are served by the same Jetty, the same /opennms web app and the same REST endpoint. The extension id in the URL decides which bundle&#x27;s JAR the file comes from; routes after # never reach the server.</desc>
