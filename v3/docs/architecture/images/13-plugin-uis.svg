<text x="24" y="59" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" fill="#475569">Both plugins are served by the same Jetty, the same /opennms web app and the same REST endpoint. The extension id in</text>
<text x="24" y="78" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" fill="#475569">the URL decides which bundle&#x27;s JAR the file comes from; routes after # never reach the server.</text>
