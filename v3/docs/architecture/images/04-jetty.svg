<text x="230" y="195.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#ea580c">HTTP</text>
<rect x="800" y="114" width="276" height="628" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
<text x="814" y="136" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0f172a">Where the web apps come from</text>
